<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교 분실물 관리</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page-shell">
<header class="topbar">
<div class="brand"><div class="brand-mark">학교</div><div class="brand-copy"><p class="eyebrow">Juyeop High School</p><h1 class="main-title">분실물을 찾아드립니다</h1><p class="subtitle">잃어버린 물건이 다시 주인을 만날 수 있도록</p></div></div>
<div class="header-actions"><button id="openRegisterModal" class="primary-btn">분실물 등록</button><button id="openAdminLoginBtn" class="secondary-btn">관리자 로그인</button></div>
</header>
<section class="toolbar"><label class="search-box"><span>검색</span><input id="searchInput" type="text" placeholder="물건 이름, 장소, 교무실로 검색"></label><div class="summary-box"><span>보관 중</span><strong id="itemCount">0개</strong></div></section>
<main><section class="section-header"><h2>현재 보관 중인 분실물</h2></section><div id="itemList" class="item-grid" aria-live="polite"></div>
<section id="adminPanel" class="admin-panel hidden"><div class="section-header admin-header"><h2>관리자 확인</h2><button id="logoutAdminBtn" class="secondary-btn small-btn">로그아웃</button></div><div class="admin-grid">
<div class="table-card"><h3>등록된 분실물 확인</h3><div class="table-wrap"><table><thead><tr><th>물건명</th><th>습득 장소</th><th>보관 교무실</th><th>습득 날짜</th><th>관리</th></tr></thead><tbody id="adminCurrentTableBody"></tbody></table></div></div>
<div class="table-card"><h3>수령 완료 기록</h3><div class="table-wrap"><table><thead><tr><th>물건명</th><th>학번</th><th>이름</th><th>수령 날짜</th><th>관리</th></tr></thead><tbody id="receivedTableBody"></tbody></table></div></div>
</div></section></main></div>

<div id="registerModal" class="modal hidden" aria-hidden="true"><div class="modal-card"><div class="modal-header"><h3>분실물 등록</h3><button id="closeRegisterModal" class="icon-btn">×</button></div>
<form id="itemForm" class="item-form">
<label><span>사진</span><input id="photoInput" type="file" name="image" accept="image/*" capture="environment"><small class="helper-text">사진을 선택하거나 카메라로 바로 찍어 등록할 수 있어요.</small></label>
<label><span>물건 이름</span><input type="text" name="name" placeholder="예: 검정 가방" required></label>
<label><span>습득 장소</span><input type="text" name="location" placeholder="예: 2층 복도" required></label>
<label><span>습득 날짜</span><input type="date" name="date" required></label>
<label><span>보관 교무실</span><select name="room" id="roomSelect" required><option value="">교무실 선택</option><option>학생안전부</option><option>제1교무실</option><option>제2교무실</option><option>1학년부</option><option>2학년부</option><option>3학년부</option></select></label>
<button type="submit" class="primary-btn wide">등록하기</button>
</form></div></div>

<div id="receiveModal" class="modal hidden" aria-hidden="true"><div class="modal-card"><div class="modal-header"><h3>분실물 수령</h3><button id="closeReceiveModal" class="icon-btn">×</button></div>
<form id="receiveForm" class="item-form"><label><span>학번</span><input name="studentId" required></label><label><span>이름</span><input name="studentName" required></label><button class="primary-btn wide">수령 완료</button></form></div></div>

<div id="adminLoginModal" class="modal hidden" aria-hidden="true"><div class="modal-card"><div class="modal-header"><h3>관리자 로그인</h3><button id="closeAdminLoginModal" class="icon-btn">×</button></div>
<form id="adminLoginForm" class="item-form"><label><span>비밀번호</span><input type="password" name="adminPassword" required></label><button class="primary-btn wide">로그인</button></form></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
